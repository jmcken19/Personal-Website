<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects · James McKenna</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="resume.html">Resume</a></li>
      <li><a href="projects.html" class="active">Projects</a></li>
      <li><a href="volleyball.html">Volleyball</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <main>
    <div class="container">

      <!-- Resume Projects -->
      <section class="resume-section">
        <p class="resume-section-title">Projects</p>

        <div class="filter-bar">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="software">Software</button>
          <button class="filter-btn" data-filter="product-management">Product Management</button>
          <button class="filter-btn" data-filter="event-management">Event Management</button>
        </div>

        <div class="writing-entry" data-tags="event-management">
          <span class="writing-title">Halton Arena — First Men's Volleyball Club Match on Campus</span>
        </div>

        <div class="writing-entry" data-tags="product-management">
          <span class="writing-title">NextOne Foundation</span>
          <div class="project-entry-links">
            <a href="https://www.nextonefoundation.com/" target="_blank" rel="noopener noreferrer">Website</a>
          </div>
        </div>

        <div class="writing-entry" data-tags="software">
          <span class="writing-title">Solana Wallet Transactions</span>
          <div class="project-entry-links">
            <a href="https://github.com/jmcken19/SolanaWalletTransactions" target="_blank" rel="noopener noreferrer">GitHub</a>
            <a href="https://solanawallettransactions.onrender.com/" target="_blank" rel="noopener noreferrer">Live Demo</a>
          </div>
        </div>

        <div class="writing-entry" data-tags="product-management">
          <span class="writing-title">PickFix · Senior Capstone</span>
          <div class="project-entry-links">
            <a href="https://github.com/Darkpenguin1/Senior-Design" target="_blank" rel="noopener noreferrer">GitHub</a>
            <a href="https://docs.google.com/presentation/d/1xDnnL5viGJoSwM31mUv2cD3gsem9y0KAMmyVhLUtfYU/edit?usp=sharing" target="_blank" rel="noopener noreferrer">Presentation</a>
          </div>
        </div>
      </section>

    </div>
  </main>

  <footer>
    <p>&copy; 2026 James McKenna</p>
  </footer>


  <script>
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const filter = btn.dataset.filter;
        document.querySelectorAll('.writing-entry').forEach(entry => {
          const tags = (entry.dataset.tags || '').split(' ');
          entry.classList.toggle('hidden', filter !== 'all' && !tags.includes(filter));
        });
      });
    });
  </script>

</body>
</html>
